services:
  app:
    environment:
      PORT: "3000"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      NOTIFIER_WEBHOOK_URL: ${NOTIFIER_WEBHOOK_URL:-}
      DATA_DIR: /app/data
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-120}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_UPLOAD_MAX: ${RATE_LIMIT_UPLOAD_MAX:-10}
      RATE_LIMIT_UPLOAD_WINDOW_MS: ${RATE_LIMIT_UPLOAD_WINDOW_MS:-60000}
      RATE_LIMIT_EXPLAIN_MAX: ${RATE_LIMIT_EXPLAIN_MAX:-5}
      RATE_LIMIT_EXPLAIN_WINDOW_MS: ${RATE_LIMIT_EXPLAIN_WINDOW_MS:-60000}
      RATE_LIMIT_ADMIN_MAX: ${RATE_LIMIT_ADMIN_MAX:-3}
      RATE_LIMIT_ADMIN_WINDOW_MS: ${RATE_LIMIT_ADMIN_WINDOW_MS:-60000}
      RATE_LIMIT_WEBHOOK_TEST_MAX: ${RATE_LIMIT_WEBHOOK_TEST_MAX:-5}
      RATE_LIMIT_WEBHOOK_TEST_WINDOW_MS: ${RATE_LIMIT_WEBHOOK_TEST_WINDOW_MS:-60000}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s
